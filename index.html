<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/torii.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Web manifest is injected by vite-plugin-pwa at build time -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-title" content="Nihongo Higoro" />
    <title>日本語ひごろ — Nihongo Higoro</title>
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      try {
        if (JSON.parse(localStorage.getItem('mayu_darkmode'))) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
